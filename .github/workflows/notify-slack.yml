name: Notify Slack

# Posts newly tagged package versions to Slack after "Build Satis" publishes
# the registry. It only reads the finished build's output; build.yml is not
# involved, and a failure here never affects the registry.
#
# - Only tagged versions count; dev-main and other branches never notify.
# - Builds started by the nightly schedule never post.
# - Every run saves the current versions as announced, also when posting
#   fails; the first run only records them.
# - Each version lists the commit titles since the previous tag, read with
#   GH_PACKAGES_TOKEN (the module repos are private).
# - Needs the SLACK_RELEASES_WEBHOOK secret (a Slack incoming webhook URL).

on:
  workflow_run:
    workflows: [Build Satis]
    types: [completed]

concurrency:
  group: notify-slack
  cancel-in-progress: false

jobs:
  notify:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      # Cache keys cannot be overwritten, so every run saves under its own key;
      # restore-keys picks the newest one.
      - name: Restore the announced versions
        uses: actions/cache/restore@v4
        with:
          path: state
          key: announced-versions-${{ github.event.workflow_run.id }}
          restore-keys: announced-versions-

      - name: Download the published registry
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: artifact

      - name: Find new tagged versions
        run: |
          set -euo pipefail
          mkdir -p web state
          tar -xf artifact/artifact.tar -C web ./p2

          for f in web/p2/arpsw/*.json; do
            case "$f" in *~dev.json) continue ;; esac
            jq -r '.packages | to_entries[] | .key as $name | .value[] | "\($name) \(.version)"' "$f"
          done | sort -u > current.txt

          if [ -f state/versions.txt ]; then
            comm -13 state/versions.txt current.txt > new.txt
          else
            echo "No list of announced versions yet: recording $(wc -l < current.txt) versions without posting."
            : > new.txt
          fi

          echo "New tagged versions: $(wc -l < new.txt)"
          cat new.txt

      - name: Post to Slack
        if: github.event.workflow_run.event != 'schedule'
        continue-on-error: true
        env:
          SLACK_RELEASES_WEBHOOK: ${{ secrets.SLACK_RELEASES_WEBHOOK }}
          GH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          set -euo pipefail
          [ -s new.txt ] || exit 0

          : > releases.jsonl
          while read -r name version; do
            previous=$(awk -v n="$name" '$1 == n { print $2 }' current.txt | sort -V | grep -x -B1 -F "$version" | head -1)
            [ "$previous" = "$version" ] && previous=""

            IFS=. read -r major minor _ <<< "${version#v}"
            IFS=. read -r previous_major previous_minor _ <<< "${previous#v}"
            if [ -z "$previous" ]; then kind="first release"
            elif [ "$major" != "$previous_major" ]; then kind="major"
            elif [ "$minor" != "$previous_minor" ]; then kind="minor"
            else kind="patch"
            fi

            commits='[]'
            if [ -n "$previous" ]; then
              commits=$(curl --fail --silent --show-error \
                -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${name}/compare/${previous}...${version}" \
                | jq -c '[.commits[] | select((.parents | length) == 1) | .commit.message | split("\n")[0]] | reverse') \
                || commits='[]'
            fi

            jq -cn --arg name "$name" --arg version "$version" --arg previous "$previous" \
              --arg kind "$kind" --argjson commits "$commits" \
              '{name: $name, version: $version, previous: $previous, kind: $kind, commits: $commits}' >> releases.jsonl
          done < new.txt

          payload=$(jq -s -f /dev/stdin releases.jsonl <<'JQ'
          def esc: gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;");
          def repo: "https://github.com/" + .name;
          def kind_text:
            if .kind == "major" then "⚠️ *major, may break*"
            elif .kind == "first release" then "first release"
            else .kind end;
          {
            text: ("New releases in the ARP package registry: " + (map(.name + " " + .version) | join(", "))),
            blocks: (
              [{type: "header", text: {type: "plain_text", text: "📦 New releases in the ARP package registry"}}]
              + map({type: "section", text: {type: "mrkdwn", text: (
                  "*<" + repo + "/tree/" + .version + "|" + .name + " " + .version + ">*   " + kind_text
                  + (if .previous != "" then " · was " + .previous else "" end)
                  + (.commits[:10] | map("\n• " + esc) | join(""))
                  + (if (.commits | length) > 10 then "\n• _and " + ((.commits | length) - 10 | tostring) + " more_" else "" end)
                  + (if .previous != "" then "\n<" + repo + "/compare/" + .previous + "..." + .version + "|What changed>" else "" end)
                )}})
              + [{type: "context", elements: [{type: "mrkdwn", text: ("Update a host with `composer update " + (map(.name) | unique | join(" ")) + "`")}]}]
            )
          }
          JQ
          )

          curl --fail --silent --show-error -X POST -H 'Content-Type: application/json' \
            --data "$payload" "$SLACK_RELEASES_WEBHOOK"

      - name: Save the announced versions
        run: cp current.txt state/versions.txt

      - uses: actions/cache/save@v4
        with:
          path: state
          key: announced-versions-${{ github.event.workflow_run.id }}

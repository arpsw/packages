name: Build Satis

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
  repository_dispatch:
    types: [rebuild]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
          coverage: none

      - name: Cache Satis installation
        id: satis-cache
        uses: actions/cache@v4
        with:
          path: satis
          key: satis-${{ github.run_id }}
          restore-keys: satis-

      - name: Install Satis
        if: steps.satis-cache.outputs.cache-hit != 'true'
        run: composer create-project --no-dev composer/satis:dev-main satis
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GH_PACKAGES_TOKEN }}"}}'

      - name: Build registry
        run: php satis/bin/satis build satis.json web
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GH_PACKAGES_TOKEN }}"}}'

      - name: Write job summary
        run: |
          echo "## Satis Registry Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Registry URL** | https://arpsw.github.io/packages/ |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered by** | \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Packages built" >> $GITHUB_STEP_SUMMARY
          ls web/p2/ | sed 's/^/- `/' | sed 's/$/`/' >> $GITHUB_STEP_SUMMARY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
